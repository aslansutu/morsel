      <rect x="341" y="349" width="36" height="435" rx="14"/>
      <rect x="405" y="458" width="56" height="326" rx="14"/>
      <rect x="490" y="556" width="44" height="228" rx="14"/>
      <rect x="562" y="458" width="56" height="326" rx="14"/>
      <rect x="647" y="349" width="36" height="435" rx="14"/>
      <rect x="712" y="240" width="72" height="544" rx="14"/>
    </g>
